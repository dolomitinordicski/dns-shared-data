name: Analytics publication Firestore security regression
on:
  pull_request:
    paths:
      - firestore.rules
      - tests/analytics-publication-rules.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/analytics-publication-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Verify strict read grants and public DTO
        run: npm run test:analytics:rules
