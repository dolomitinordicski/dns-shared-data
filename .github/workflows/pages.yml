name: Deploy architecture overview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web-runtime/**'
      - 'brand/**'
      - 'graphics/**'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build canonical package
        run: |
          npm install
          npm run build:package

      - name: Stage public site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R dist brand graphics web-runtime docs _site/
          if [ -d assets ]; then cp -R assets _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
