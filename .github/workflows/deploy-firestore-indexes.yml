name: Deploy Firestore indexes

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate index manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); console.log('Firestore index manifest valid.')"
      - name: Deploy indexes only
        run: npx --yes firebase-tools@14.12.0 deploy --only firestore:indexes --project dns-core
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
