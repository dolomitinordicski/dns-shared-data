name: Deploy DNS Design System
# Fresh runs pick up current repository secrets.

on:
  push:
    branches: [main]
    paths:
      - 'src/design-system.ts'
      - 'scripts/seed-design-system.ts'
      - 'firestore.rules'
      - '.github/workflows/deploy-design-system.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE (or FIREBASE_SERVICE_ACCOUNT) repository secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Publish design system
        run: npm run seed:design-system:apply
        env:
          GOOGLE_CLOUD_PROJECT: dns-core

      - name: Deploy Firestore rules
        run: npm run deploy:firebase:rules
