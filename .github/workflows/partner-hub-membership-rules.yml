name: Partner Hub membership security rules
on:
  pull_request:
    paths:
      - firestore.rules
      - tests/partner-hub-membership-rules.test.mjs
      - package.json
      - scripts/provision-partner-hub-membership.ts
      - .github/workflows/partner-hub-membership-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  membership-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - name: Reject all client membership reads and writes
        run: npm run test:partner-hub:rules
      - name: Confirm provisioning defaults to dry-run
        run: npm run provision:partner-hub -- --email=example@partner.invalid --establishment=test-hotel
