name: Validate master dataset

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "firebase.json"
      - "firestore.rules"
      - ".firebaserc"
      - ".github/workflows/master-data-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate seed plan
        run: npm run seed:firebase

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test seasonal Firestore rules
        run: npm run test:rules
