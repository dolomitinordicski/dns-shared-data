name: Deploy 2026-27 Pocketfolder Setup

on:
  push:
    branches: [main]
    paths:
      - 'src/pocketfolder-setup-2026-27.ts'
      - 'scripts/seed-pocketfolder-2026-27.ts'
      - '.github/workflows/deploy-pocketfolder-setup.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: dns-production-auto
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run seed:pocketfolder:2026-27:apply
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
