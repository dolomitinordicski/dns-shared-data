name: Publish Analytics public snapshot

on:
  push:
    branches: [main]
    paths:
      - 'src/analytics-public.ts'
      - 'scripts/publish-analytics-public-snapshot.ts'
      - 'scripts/analytics-audit-snapshot.json'
      - '.github/workflows/publish-analytics-public-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: analytics-public-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run publish:analytics-public
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
      - run: npm run publish:analytics-public:apply
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
