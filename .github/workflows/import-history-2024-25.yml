# Historical archive: normal reads use Firestore; original files remain provenance.
# Reimport is recovery tooling only and must be started explicitly.
name: Import immutable 2024-25 history
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: history-2024-25
  cancel-in-progress: false
jobs:
  import:
    environment: dns-production-auto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install openpyxl==3.1.5 pypdf==6.10.0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Google Drive API for private source reads
        continue-on-error: true
        run: gcloud services enable drive.googleapis.com --project=dns-core
      - name: Import private sources and verify Firebase
        run: node scripts/history/import-2024-25.mjs --apply
