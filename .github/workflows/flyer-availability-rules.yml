name: Flyer availability policy access regression
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/flyer-availability-rules.test.mjs'
      - '.github/workflows/flyer-availability-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flyer-availability-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:flyer-availability:rules
