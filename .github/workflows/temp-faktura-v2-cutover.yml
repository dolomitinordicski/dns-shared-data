name: TEMP Faktura v2 cutover activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-faktura-v2-cutover.yml'

permissions:
  contents: read
  id-token: write

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Faktura v2 branch
        uses: actions/checkout@v4
        with:
          repository: dolomitinordicski/DNS-Faktura
          ref: refactor/faktura-v2-domain
          path: faktura

      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shared-data dependencies
        run: npm install

      - name: Install Faktura audit dependencies
        run: npm --prefix faktura/functions install --ignore-scripts

      - name: Retry helper
        shell: bash
        run: |
          cat > /tmp/retry.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          n=0
          until [ "$n" -ge 5 ]; do
            "$@" && exit 0
            n=$((n+1))
            echo "Attempt $n failed; retrying in 15 seconds..."
            sleep 15
          done
          echo "Command failed after 5 attempts: $*"
          exit 1
          EOF
          chmod +x /tmp/retry.sh

      - name: Normalize canonical 2026-27 Faktura rates
        run: /tmp/retry.sh npm run seed:billing-rates:2026-27:apply
        env:
          GOOGLE_CLOUD_PROJECT: dns-core

      - name: Seed canonical IDM Premium program
        run: /tmp/retry.sh npm run seed:idm-premium-programs:apply
        env:
          GOOGLE_CLOUD_PROJECT: dns-core

      - name: Deploy Faktura v2 Firestore indexes
        run: /tmp/retry.sh npx --yes firebase-tools@14.12.0 deploy --only firestore:indexes --project dns-core
        env:
          GOOGLE_CLOUD_PROJECT: dns-core

      - name: Final read-only cutover audit
        run: node faktura/functions/scripts/cutover-audit.mjs --season=2026-27 --require-activation-ready
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
