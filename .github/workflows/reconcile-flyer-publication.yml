name: Reconcile scoped Flyer publication
on:
  pull_request:
    paths: ['scripts/reconcile-flyer-publication*', '.github/workflows/reconcile-flyer-publication.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Add publication to eligible existing area grants'
        type: boolean
        default: false
      authorization:
        description: 'For apply: AUTORIZZO DEPLOY PR #259'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test scripts/reconcile-flyer-publication.test.mjs
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    environment: dns-release-approval
    concurrency:
      group: flyer-publication-reconciliation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - name: Reconcile existing area writers only
        env:
          APPLY: ${{ inputs.apply }}
          RELEASE_AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          if [ "$APPLY" = "true" ]; then
            node scripts/reconcile-flyer-publication.mjs --apply
          else
            node scripts/reconcile-flyer-publication.mjs
          fi
