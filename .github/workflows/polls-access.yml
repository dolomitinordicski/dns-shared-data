name: Verify Polls Core authorization
on:
  pull_request:
    paths:
      - 'server/polls-access.mjs'
      - 'server/polls-events.mjs'
      - 'server/polls-bridge-http.mjs'
      - 'server/polls-bridge-entry.mjs'
      - 'tests/polls-access.test.mjs'
      - 'tests/polls-bridge.test.mjs'
      - '.github/workflows/polls-access.yml'
  push:
    branches: [main]
    paths:
      - 'server/polls-access.mjs'
      - 'server/polls-events.mjs'
      - 'server/polls-bridge-http.mjs'
      - 'server/polls-bridge-entry.mjs'
      - 'tests/polls-access.test.mjs'
      - 'tests/polls-bridge.test.mjs'
      - '.github/workflows/polls-access.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/polls-access.test.mjs tests/polls-bridge.test.mjs
