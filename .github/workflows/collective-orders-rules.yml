name: Collective Orders Firestore Rules
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/collective-orders-rules.test.mjs'
      - 'package.json'
      - '.github/workflows/collective-orders-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:collective-orders:rules
      - run: npm run test:rules
