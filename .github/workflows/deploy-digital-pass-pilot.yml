name: DNS Digital Pass limited pilot (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'For preflight enter preflight; for a separately authorized cloud deploy enter dns-core/digitalPassApi'
        required: true
        type: string
      phase:
        description: 'preflight is local only; verify deploys closed; smoke tests the existing private service without redeploy; activate opens the bounded pilot; stop disables claims'
        required: true
        type: choice
        options: [preflight, verify, smoke, activate, stop]
        default: preflight
permissions:
  contents: read
  checks: read
  id-token: write
concurrency:
  group: dns-digital-pass-real-pilot
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'preflight' && inputs.confirm_target == 'preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate pilot release safeguards without credentials or cloud access
        run: node --test tests/digital-pass-pilot-release.test.mjs
      - name: Report scope
        run: echo 'Preflight only; no environment secrets, Firebase authentication, IAM checks or deployment.'
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.phase != 'preflight' && inputs.phase != 'smoke' && inputs.confirm_target == 'dns-core/digitalPassApi'
    environment: dns-digital-pass-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DNS_PASS_RELEASE_PHASE: ${{ inputs.phase }}
      DNS_PASS_DEPLOY_APPROVED: ${{ vars.DNS_PASS_DEPLOY_APPROVED }}
      DNS_PASS_ACTIVATE_APPROVED: ${{ vars.DNS_PASS_ACTIVATE_APPROVED }}
      DNS_PASS_PRIVACY_REVIEWED: ${{ vars.DNS_PASS_PRIVACY_REVIEWED }}
      DNS_PASS_PILOT_ORGANIZATION_ID: ${{ secrets.DNS_PASS_PILOT_ORGANIZATION_ID }}
      DNS_PASS_PILOT_SCOPE: ${{ vars.DNS_PASS_PILOT_SCOPE }}
      DNS_PASS_PILOT_PASS_NUMBER: ${{ secrets.DNS_PASS_PILOT_PASS_NUMBER }}
      DNS_PASS_PILOT_OPERATOR_UID: ${{ secrets.DNS_PASS_PILOT_OPERATOR_UID }}
      DNS_PASS_PILOT_UNTIL: ${{ vars.DNS_PASS_PILOT_UNTIL }}
      DNS_PASS_DATA_ENTRY_START_NUMBER: ${{ vars.DNS_PASS_DATA_ENTRY_START_NUMBER }}
      DNS_PASS_INVENTORY_REVISION: ${{ vars.DNS_PASS_INVENTORY_REVISION }}
      DNS_PASS_PRIVACY_NOTICE_VERSION: ${{ vars.DNS_PASS_PRIVACY_NOTICE_VERSION }}
      DNS_PASS_PRIVACY_URL: ${{ vars.DNS_PASS_PRIVACY_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require explicit release approval before build or cloud authentication
        run: |
          if [ "$DNS_PASS_DEPLOY_APPROVED" != true ]; then
            echo '::error::Set DNS_PASS_DEPLOY_APPROVED=true in dns-digital-pass-pilot only after explicit release authorization. No cloud calls were made.'
            exit 1
          fi
          if [ "$DNS_PASS_RELEASE_PHASE" = activate ] && [ "$DNS_PASS_ACTIVATE_APPROVED" != true ]; then
            echo '::error::ACTIVATE requires a new, separate approval after completed VERIFY.'
            exit 1
          fi
      - name: Require passing synthetic checks on this exact commit
        if: inputs.phase != 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const names=['domain','emulator','qr-renderer','http-e2e (1)','http-e2e (2)','http-e2e (3)','staging-emulator','pilot-release'];
          const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/commits/'+process.env.GITHUB_SHA+'/check-runs?per_page=100';
          const deadline=Date.now()+10*60*1000;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          while(true){
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!response.ok)throw Error('CI_STATUS_UNAVAILABLE: HTTP '+response.status);
            const {check_runs}=await response.json();
            const missing=[],pending=[];
            for(const name of names){
              const matches=check_runs.filter(x=>x.name===name && x.app?.slug==='github-actions');
              const success=matches.some(x=>x.status==='completed' && x.conclusion==='success');
              if(success)continue;
              const failed=matches.find(x=>x.status==='completed' && !['success','skipped'].includes(x.conclusion));
              if(failed)throw Error('SYNTHETIC_CHECK_FAILED: '+name+' ('+failed.conclusion+')');
              if(matches.length)pending.push(name);
              else missing.push(name);
            }
            if(!missing.length && !pending.length){console.log('All '+names.length+' required synthetic checks passed for '+process.env.GITHUB_SHA);break;}
            if(Date.now()>=deadline)throw Error('SYNTHETIC_CHECK_TIMEOUT: missing='+missing.join(',')+' pending='+pending.join(','));
            console.log('Waiting for required checks; missing='+missing.join(',')+' pending='+pending.join(','));
            await sleep(15000);
          }
          NODE
      - name: Validate emergency stop locally without waiting for unrelated commit checks
        if: inputs.phase == 'stop'
        run: node --test tests/digital-pass-pilot-release.test.mjs
      - name: Build reviewed single-function release (verify refuses all API operations)
        run: node scripts/prepare-digital-pass-real-pilot.mjs
      - name: Install pinned runtime and isolated Firebase CLI
        run: |
          npm ci --prefix .digital-pass-real-pilot/server --ignore-scripts
          npm install --prefix tools/digital-pass-e2e --ignore-scripts --no-package-lock
      - name: Verify single export before cloud authentication
        run: |
          node --input-type=module -e "const m=await import('./.digital-pass-real-pilot/server/firebase-entry.mjs');if(JSON.stringify(Object.keys(m))!==JSON.stringify(['digitalPassApi']))throw Error('UNEXPECTED_FUNCTION_EXPORT')"
      - name: Verify deployment credential project without printing it
        env:
          DNS_DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
        run: |
          node --input-type=module -e "const c=JSON.parse(process.env.DNS_DEPLOY_CREDENTIAL||'{}');if(c.project_id!=='dns-core'||!c.client_email?.endsWith('@dns-core.iam.gserviceaccount.com'))throw Error('DNS_CORE_DEPLOY_CREDENTIAL_REQUIRED')"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check runtime IAM without changing it
        run: python3 scripts/check-digital-pass-runtime-iam.py
      - name: Deploy only the approved Digital Pass function
        # No IAM changes: detect the actual default builder and all deployment gaps together.
        # This preflight intentionally executes before the Firebase upload/create request.
        # Permission grants remain a separately approved administrator operation.
        if: success()
        run: |
          node scripts/verify-digital-pass-closed.mjs --mode access --report .digital-pass-verification/access.json
          node scripts/deploy-digital-pass-pilot.mjs
      - name: Verify closed deployment metadata without requiring an invoker
        if: inputs.phase != 'activate'
        run: node scripts/verify-digital-pass-closed.mjs --mode metadata --report .digital-pass-verification/metadata.json
      - name: Upload closed metadata evidence
        if: success() && inputs.phase != 'activate'
        uses: actions/upload-artifact@v4
        with:
          name: digital-pass-closed-metadata
          path: .digital-pass-verification/metadata.json
      - name: Verify active infrastructure boundary
        if: inputs.phase == 'activate'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SA="$(gcloud functions describe digitalPassApi --gen2 --region=europe-west8 --project=dns-core --format='value(serviceConfig.serviceAccountEmail)')"
          test "$ACTUAL_SA" = dns-digital-pass-runtime@dns-core.iam.gserviceaccount.com
          SERVICE_URL="$(gcloud functions describe digitalPassApi --gen2 --region=europe-west8 --project=dns-core --format='value(serviceConfig.uri)')"
          API="$SERVICE_URL"
          AUTH=()
          WRONG="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${AUTH[@]}" -X POST "$API/v1/pass-activations/prepare" -H 'Origin: https://unapproved.example' -H 'Content-Type: application/json' --data '{}')"
          test "$WRONG" = 403
          CLOSED=401
          for ROUTE in /v1/pass-activations/claim /v1/pass-registrations/complete; do
            CODE="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${AUTH[@]}" -X POST "$API$ROUTE" -H 'Origin: https://dolomitinordicski.github.io' -H 'Content-Type: application/json' --data '{}')"
            test "$CODE" = "$CLOSED"
          done
          echo 'Only infrastructure/auth smoke checks passed. Real operator and smartphone acceptance are still required.'


  smoke:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'smoke' && inputs.confirm_target == 'dns-core/digitalPassApi'
    environment: dns-digital-pass-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require separate approval for authenticated closed smoke
        env:
          DNS_PASS_VERIFY_APPROVED: ${{ vars.DNS_PASS_VERIFY_APPROVED }}
        run: |
          test "$DNS_PASS_VERIFY_APPROVED" = true || { echo '::error::Closed smoke requires explicit authorization'; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Test the existing private closed revision without redeployment
        run: node scripts/verify-digital-pass-closed.mjs --mode smoke --report .digital-pass-verification/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: digital-pass-closed-smoke
          path: .digital-pass-verification/smoke.json
      - name: Report remaining completion gate
        run: echo 'Authenticated closed smoke passed; revoke temporary access before declaring VERIFY complete. ACTIVATE remains separately gated.'
