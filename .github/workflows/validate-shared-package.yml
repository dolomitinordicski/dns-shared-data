name: Validate DNS Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web-runtime/**'
      - 'index.html'
      - 'scripts/check-web-design-system.mjs'
      - 'scripts/check-web-data-contracts.mjs'
      - 'scripts/check-web-system-status.mjs'
      - 'scripts/check-web-accessibility.mjs'
      - 'scripts/check-web-navigation.mjs'
      - 'scripts/check-localization-contract.mjs'
      - 'scripts/check-foundation-runtime.mjs'
      - 'scripts/check-shell-profiles.mjs'
      - 'scripts/check-print-profiles.mjs'
      - 'scripts/check-motion-semantics.mjs'
      - 'scripts/check-data-ui.mjs'
      - 'scripts/check-identity-ui.mjs'
      - 'scripts/check-assets-workspace.mjs'
      - 'scripts/check-release-freeze.mjs'
      - 'scripts/check-capabilities.mjs'
      - 'scripts/check-capabilities.mjs'
      - 'releases/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsconfig.package.json'
      - '.github/workflows/validate-shared-package.yml'
      - '.github/workflows/release-foundation.yml'
      - 'docs/DNS-Foundation-Propagation-v1.md'
  pull_request:
    paths:
      - 'src/**'
      - 'web-runtime/**'
      - 'index.html'
      - 'scripts/check-web-design-system.mjs'
      - 'scripts/check-web-data-contracts.mjs'
      - 'scripts/check-web-system-status.mjs'
      - 'scripts/check-web-accessibility.mjs'
      - 'scripts/check-web-navigation.mjs'
      - 'scripts/check-localization-contract.mjs'
      - 'scripts/check-foundation-runtime.mjs'
      - 'scripts/check-shell-profiles.mjs'
      - 'scripts/check-print-profiles.mjs'
      - 'scripts/check-motion-semantics.mjs'
      - 'scripts/check-data-ui.mjs'
      - 'scripts/check-identity-ui.mjs'
      - 'scripts/check-assets-workspace.mjs'
      - 'scripts/check-release-freeze.mjs'
      - 'releases/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsconfig.package.json'
      - '.github/workflows/validate-shared-package.yml'
      - '.github/workflows/release-foundation.yml'
      - 'docs/DNS-Foundation-Propagation-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and run prepare
        run: npm install

      - name: Build package
        run: npm run build:package

      - name: Typecheck
        run: npm run typecheck

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify browser Design System mirror
        run: node scripts/check-web-design-system.mjs

      - name: Verify browser Data Contracts mirror
        run: node scripts/check-web-data-contracts.mjs

      - name: Verify browser System Status mirror
        run: node scripts/check-web-system-status.mjs

      - name: Verify browser accessibility runtime
        run: node scripts/check-web-accessibility.mjs

      - name: Verify browser navigation runtime
        run: node scripts/check-web-navigation.mjs

      - name: Verify localization contract
        run: node scripts/check-localization-contract.mjs

      - name: Verify Foundation runtime contract
        run: node scripts/check-foundation-runtime.mjs

      - name: Verify shell profile contract
        run: node scripts/check-shell-profiles.mjs

      - name: Verify print profile contract
        run: node scripts/check-print-profiles.mjs

      - name: Verify motion semantics contract
        run: node scripts/check-motion-semantics.mjs

      - name: Verify F5 data UI contract
        run: node scripts/check-data-ui.mjs

      - name: Verify F6 identity UI contract
        run: node scripts/check-identity-ui.mjs

      - name: Verify F7 assets/workspace contract
        run: node scripts/check-assets-workspace.mjs

      - name: Verify F8 release/freeze contract
        run: node scripts/check-release-freeze.mjs

      - name: Verify C1 shared capabilities contract
        run: node scripts/check-capabilities.mjs
