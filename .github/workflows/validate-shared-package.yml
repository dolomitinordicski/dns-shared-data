name: Validate DNS Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web-runtime/**'
      - 'index.html'
      - 'scripts/check-web-design-system.mjs'
      - 'scripts/check-web-data-contracts.mjs'
      - 'scripts/check-web-system-status.mjs'
      - 'scripts/check-web-accessibility.mjs'
      - 'scripts/check-web-navigation.mjs'
      - 'scripts/check-localization-contract.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsconfig.package.json'
      - '.github/workflows/validate-shared-package.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web-runtime/**'
      - 'index.html'
      - 'scripts/check-web-design-system.mjs'
      - 'scripts/check-web-data-contracts.mjs'
      - 'scripts/check-web-system-status.mjs'
      - 'scripts/check-web-accessibility.mjs'
      - 'scripts/check-web-navigation.mjs'
      - 'scripts/check-localization-contract.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsconfig.package.json'
      - '.github/workflows/validate-shared-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and run prepare
        run: npm install

      - name: Build package
        run: npm run build:package

      - name: Typecheck
        run: npm run typecheck

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify browser Design System mirror
        run: node scripts/check-web-design-system.mjs

      - name: Verify browser Data Contracts mirror
        run: node scripts/check-web-data-contracts.mjs

      - name: Verify browser System Status mirror
        run: node scripts/check-web-system-status.mjs

      - name: Verify browser accessibility runtime
        run: node scripts/check-web-accessibility.mjs

      - name: Verify browser navigation runtime
        run: node scripts/check-web-navigation.mjs

      - name: Verify localization contract
        run: node scripts/check-localization-contract.mjs
