name: Faktura v2 read-only cutover audit

on:
  push:
    branches:
      - faktura-v2-security-boundary-v2
    paths:
      - '.github/workflows/faktura-v2-cutover-audit.yml'
      - 'src/idm-premium-programs.ts'
      - 'scripts/seed-idm-premium-programs.ts'
      - 'scripts/seed-billing-rates-2026-27.ts'
      - 'firestore.indexes.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - name: Checkout shared data
        uses: actions/checkout@v4

      - name: Checkout Faktura v2 branch
        uses: actions/checkout@v4
        with:
          repository: dolomitinordicski/DNS-Faktura
          ref: refactor/faktura-v2-domain
          path: faktura

      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Faktura audit dependencies
        run: npm --prefix faktura/functions install --ignore-scripts

      - name: Run read-only DNS Core cutover audit
        run: node faktura/functions/scripts/cutover-audit.mjs --season=2026-27 --fail-on-blockers
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
