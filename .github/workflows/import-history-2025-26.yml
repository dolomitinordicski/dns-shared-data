# Archived history maintenance must be started explicitly.
# Dependency and workflow updates must not write or prune historical data.
name: Import immutable 2025-26 history
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: history-2025-26
  cancel-in-progress: false
jobs:
  import:
    environment: dns-production-auto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install openpyxl==3.1.5
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - name: Import private sources and verify Firebase
        run: node scripts/history/import.mjs --apply
