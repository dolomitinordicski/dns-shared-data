name: Import immutable 2025-26 history
on:
  push:
    branches: [main]
    paths: ['scripts/history/extract.py', 'scripts/history/import.mjs', '.github/workflows/import-history-2025-26.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: history-2025-26
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish import encryption public key
        if: ${{ hashFiles('scripts/history/2025-26.encrypted.json') == '' }}
        env:
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
        run: node -e 'const c=require("node:crypto"); const a=JSON.parse(process.env.FIREBASE_ACCOUNT); console.log("IMPORT_PUBLIC_KEY="+c.createPublicKey(a.private_key).export({type:"spki",format:"der"}).toString("base64"));'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install openpyxl==3.1.5
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      - name: Import private sources and verify Firebase
        run: node scripts/history/import.mjs --apply
