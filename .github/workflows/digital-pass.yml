name: Digital Pass domain checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/digital-pass-*.mjs'
      - 'server/firebase-entry.mjs'
      - 'tests/digital-pass-*.test.mjs'
      - 'tests/helpers/digital-pass-*.mjs'
      - '.github/workflows/digital-pass.yml'
  pull_request:
    paths:
      - 'server/digital-pass-*.mjs'
      - 'tests/digital-pass-*.test.mjs'
      - 'tests/helpers/digital-pass-*.mjs'
      - 'src/access-control.ts'
      - 'server/firebase-entry.mjs'
      - '.github/workflows/digital-pass.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/digital-pass-*.test.mjs
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm install --prefix server --ignore-scripts --no-package-lock
      - run: node --input-type=module -e "await import('./server/firebase-entry.mjs')"
      - run: npx firebase emulators:exec --config firebase.emulator.json --only firestore --project demo-dns-core "node --test tests/digital-pass-firestore.test.mjs"
