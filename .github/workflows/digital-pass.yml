name: Digital Pass domain checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/digital-pass-*.mjs'
      - 'server/firebase-entry.mjs'
      - 'scripts/prepare-digital-pass-real-pilot.mjs'
      - '.github/workflows/deploy-digital-pass-pilot.yml'
      - 'scripts/run-digital-pass-e2e.mjs'
      - 'firebase.e2e.json'
      - 'tools/digital-pass-e2e/**'
      - 'tools/digital-pass-staging/**'
      - 'server/firebase-staging-entry.mjs'
      - 'scripts/prepare-digital-pass-staging.mjs'
      - 'tests/qr/**'
      - 'tests/staging/**'
      - 'tests/fixtures/digital-pass-qr-*.json'
      - 'tests/digital-pass-*.test.mjs'
      - 'tests/helpers/digital-pass-*.mjs'
      - '.github/workflows/digital-pass.yml'
  pull_request:
    paths:
      - 'server/digital-pass-*.mjs'
      - 'tests/digital-pass-*.test.mjs'
      - 'tests/helpers/digital-pass-*.mjs'
      - 'src/access-control.ts'
      - 'server/firebase-entry.mjs'
      - 'scripts/prepare-digital-pass-real-pilot.mjs'
      - '.github/workflows/deploy-digital-pass-pilot.yml'
      - 'scripts/run-digital-pass-e2e.mjs'
      - 'firebase.e2e.json'
      - 'tools/digital-pass-e2e/**'
      - 'tools/digital-pass-staging/**'
      - 'server/firebase-staging-entry.mjs'
      - 'scripts/prepare-digital-pass-staging.mjs'
      - 'tests/qr/**'
      - 'tests/staging/**'
      - 'tests/fixtures/digital-pass-qr-*.json'
      - '.github/workflows/digital-pass.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/digital-pass-*.test.mjs
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm install --prefix server --ignore-scripts --no-package-lock
      - run: npm run build:package
      - run: npm run typecheck
      - run: node --input-type=module -e "await import('./server/firebase-entry.mjs')"
      - run: npx firebase emulators:exec --config firebase.emulator.json --only firestore --project demo-dns-core "node --test tests/digital-pass-firestore.test.mjs"

  qr-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --prefix tools/digital-pass-e2e --ignore-scripts --no-package-lock
      - run: node --test tests/qr/digital-pass-rendered-qr.test.mjs

  http-e2e:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm install --prefix server --ignore-scripts --no-package-lock
      - run: npm install --prefix tools/digital-pass-e2e --ignore-scripts --no-package-lock
      - name: Synthetic Auth + Functions + Firestore HTTP acceptance
        run: npm run test:digital-pass:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-pass-http-e2e-${{ matrix.repetition }}
          path: .digital-pass-e2e/results/
          if-no-files-found: warn

  staging-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm install --prefix tools/digital-pass-e2e --ignore-scripts --no-package-lock
      - run: node scripts/prepare-digital-pass-staging.mjs demo-dns-pass-staging-c1 --emulator
      - run: npm ci --prefix .digital-pass-staging/server --ignore-scripts
      - run: node --test tests/staging/digital-pass-export.test.mjs
      - name: Isolated staging export with demo project and synthetic inventory only
        run: npm run test:digital-pass:e2e
        env:
          DNS_PASS_E2E_STAGING: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-pass-staging-emulator
          path: .digital-pass-e2e/results/
          if-no-files-found: warn

  pilot-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Materialize only the real-pilot function with synthetic settings
        run: |
          node --input-type=module <<'NODE'
          import {preparePilotRelease} from './scripts/prepare-digital-pass-real-pilot.mjs';
          await preparePilotRelease({
            DNS_PASS_RELEASE_PHASE:'verify',DNS_PASS_DEPLOY_APPROVED:'true',DNS_PASS_PRIVACY_REVIEWED:'true',
            DNS_PASS_PILOT_ORGANIZATION_ID:'synthetic-org-a',DNS_PASS_PILOT_PASS_NUMBER:'1',DNS_PASS_PILOT_OPERATOR_UID:'synthetic-operator',
            DNS_PASS_PILOT_UNTIL:new Date(Date.now()+3600000).toISOString(),DNS_PASS_DATA_ENTRY_START_NUMBER:'1',
            DNS_PASS_INVENTORY_REVISION:'data-entry-2026-27-'+'a'.repeat(64),
            DNS_PASS_PRIVACY_NOTICE_VERSION:'dns-digital-pass-2026-27-synthetic-v1',DNS_PASS_PRIVACY_URL:'https://example.test/privacy',
          });
          NODE
      - run: npm ci --prefix .digital-pass-real-pilot/server --ignore-scripts
      - name: Confirm single export without credentials or Firebase initialization
        run: |
          node --input-type=module -e "const m=await import('./.digital-pass-real-pilot/server/firebase-entry.mjs');if(JSON.stringify(Object.keys(m))!==JSON.stringify(['digitalPassApi']))throw Error('UNEXPECTED_FUNCTION_EXPORT');const e=m.digitalPassApi.__endpoint;if(e.secretEnvironmentVariables?.length||e.httpsTrigger.invoker?.includes('public'))throw Error('VERIFY_MUST_BE_PRIVATE_WITHOUT_SECRETS')"
      - run: python3 -m py_compile scripts/check-digital-pass-runtime-iam.py

