name: TEMP Faktura v2 functions activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-faktura-v2-functions.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Faktura main
        uses: actions/checkout@v4
        with:
          repository: dolomitinordicski/DNS-Faktura
          ref: main
          path: faktura

      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions dependencies
        run: npm --prefix faktura/functions install --ignore-scripts

      - name: Validate Functions
        run: node --check faktura/functions/src/index.mjs

      - name: Deploy Faktura public Functions
        working-directory: faktura
        run: >
          npx --yes firebase-tools@14.12.0 deploy
          --only functions:resolvePublicConfirmation,functions:submitPublicConfirmation
          --project dns-core
        env:
          GOOGLE_CLOUD_PROJECT: dns-core

      - name: Final production cutover audit
        run: node faktura/functions/scripts/cutover-audit.mjs --season=2026-27 --require-activation-ready
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
