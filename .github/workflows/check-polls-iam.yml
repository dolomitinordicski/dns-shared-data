name: DNS Polls IAM preflight (read only)
on:
  workflow_dispatch:
    inputs:
      confirm_check:
        description: 'Type dns-polls/check-iam (no deploy or policy changes)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  check:
    if: github.ref == 'refs/heads/main' && inputs.confirm_check == 'dns-polls/check-iam'
    runs-on: ubuntu-latest
    environment: dns-polls-bridge-production
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
      BRIDGE_ACCOUNT: ${{ vars.DNS_POLLS_BRIDGE_SERVICE_ACCOUNT }}
      BRIDGE_REGION: ${{ vars.DNS_POLLS_REGION }}
      BRIDGE_ORIGINS: ${{ vars.DNS_POLLS_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          [[ "$BRIDGE_ACCOUNT" =~ ^[a-z][a-z0-9-]*@dns-core\.iam\.gserviceaccount\.com$ ]]
          test "$BRIDGE_ORIGINS" = 'https://dolomitinordicski.github.io'
          [[ "$BRIDGE_REGION" =~ ^europe-[a-z]+[0-9]+$ ]]
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check existence of resources without modifying IAM
        shell: bash
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "$BRIDGE_ACCOUNT" --project=dns-core --format='value(email)' >/dev/null
          gcloud firestore databases describe --project=dns-core --database='(default)' --format='value(name)' >/dev/null
          gcloud firestore databases describe --project=dns-polls --database='(default)' --format='value(name)' >/dev/null
          echo 'Core and Polls resources are reachable by the deploy principal.'
          echo 'This does not prove that the runtime identity has scoped access.'
