name: DNS Loipen daily history
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Read DNS regional site counters
        run: npm run inspect:loipen:network -- loipen-network.json
      - name: Determine archival start date
        id: archive-date
        run: |
          today=$(TZ=Europe/Rome date +%F)
          if [[ "$today" < "2026-10-29" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Pre-start inspection only ($today); Firestore archive begins 2026-10-29"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate daily archive (no writes)
        if: steps.archive-date.outputs.eligible == 'true'
        run: npm run archive:loipen:daily -- loipen-network.json
      - name: Authenticate dedicated publisher
        if: steps.archive-date.outputs.eligible == 'true' && vars.DNS_LOIPEN_ARCHIVE_ENABLED == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DNS_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.DNS_LOIPEN_ARCHIVE_SERVICE_ACCOUNT }}
      - name: Archive today's DNS regional snapshots
        if: steps.archive-date.outputs.eligible == 'true' && vars.DNS_LOIPEN_ARCHIVE_ENABLED == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
        run: npm run archive:loipen:daily -- loipen-network.json --apply
      - name: Publish approved daily Loipen totals to public widgets
        if: steps.archive-date.outputs.eligible == 'true' && vars.DNS_LOIPEN_ARCHIVE_ENABLED == 'true' && vars.DNS_LOIPEN_WIDGET_PUBLISH_ENABLED == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
        run: |
          npm run publish:loipen:widget
          npm run publish:loipen:widget -- --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-loipen-daily-report
          path: loipen-network.json
          if-no-files-found: warn
          retention-days: 30
