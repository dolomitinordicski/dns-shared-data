name: DNS Loipen network inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run inspect:loipen:network -- loipen-network.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-loipen-network-inspection
          path: loipen-network.json
          if-no-files-found: warn
          retention-days: 7
