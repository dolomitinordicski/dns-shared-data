name: Release DNS Foundation
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Foundation SemVer from package.json (for example 1.1.2)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: foundation-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate package
        run: |
          npm run build:package
          npm run typecheck
          npm pack --dry-run
      - name: Validate release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const requested = process.env.REQUESTED_VERSION;
          const actual = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\\d+\\.\\d+\\.\\d+$/.test(requested ?? '')) {
            throw new Error('Version must use plain SemVer, for example 1.1.2.');
          }
          if (requested !== actual) {
            throw new Error(`Requested ${requested}, but package.json declares ${actual}.`);
          }
          NODE
          echo "tag=foundation-v${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/foundation-v${REQUESTED_VERSION}" >/dev/null 2>&1; then
            echo "::error::Release tag foundation-v${REQUESTED_VERSION} already exists. Releases are immutable."
            exit 1
          fi
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "DNS Foundation $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "DNS Foundation ${TAG#foundation-v}" --generate-notes
